name: Sync Upstream

on:
  schedule:
    # Every six hours; GitHub schedules use UTC.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      redeploy:
        description: Validate and redeploy even when upstream is unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream without replacing production configuration
        id: upstream
        shell: bash
        env:
          FORCE_REDEPLOY: ${{ inputs.redeploy || false }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/wangwangit/SubsTracker.git
          git fetch --no-tags upstream master
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge-base --is-ancestor upstream/master HEAD && [[ "$FORCE_REDEPLOY" != 'true' ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Already includes the latest upstream commit.' >> "$GITHUB_STEP_SUMMARY"
            # Public repositories lose scheduled workflows after 60 idle days.
            if (( $(date +%s) - $(git log -1 --format=%ct) >= 30 * 86400 )); then
              git commit --allow-empty -m 'chore: keep scheduled upstream sync active'
              git push origin HEAD:master
              echo 'Created a monthly keepalive commit (no source changes).' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if git merge-base --is-ancestor upstream/master HEAD; then
            git commit --allow-empty -m 'chore: verify automated production deployment'
          else
            if ! git merge --no-commit --no-ff upstream/master; then
              # Only CI-file conflicts are safe to resolve by keeping our CI.
              if [[ ! -f "$(git rev-parse --git-path MERGE_HEAD)" ]] ||
                 [[ -n "$(git diff --name-only --diff-filter=U -- . ':!.github/workflows/**')" ]]; then
                echo 'Upstream merge failed; no update was published.' >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            # Keep fork-owned CI; GITHUB_TOKEN cannot publish workflow changes.
            git rm -r -f --ignore-unmatch -- .github/workflows
            git restore --source=HEAD --staged --worktree -- .github/workflows
            git commit --no-edit
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "Upstream: $(git rev-parse upstream/master)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check the currently deployed commit
        id: production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('Configure the CLOUDFLARE_API_TOKEN repository secret before deploying.');
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/75710b3f985b2a09e812e5c861251ca8/workers/scripts/substracker/settings', {
            headers: { Authorization: `Bearer ${token}` },
            signal: AbortSignal.timeout(30000)
          });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(`Cloudflare settings request failed: ${JSON.stringify(data.errors)}`);
          const deployed = data.result.bindings.find(binding => binding.name === 'SOURCE_COMMIT')?.text;
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const verified = execFileSync('git', ['ls-remote', 'origin', 'refs/tags/production-verified'], { encoding: 'utf8' }).trim().split(/\s+/)[0];
          const changed = deployed !== sha || verified !== sha;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\nsha=${sha}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Production ${changed ? 'needs deployment or verification for' : 'already matches verified'} commit ${sha}.\n`);
          JS

      - name: Validate the update before publishing
        if: steps.upstream.outputs.changed == 'true' || steps.production.outputs.changed == 'true'
        run: |
          npm ci
          npm run lint
          npm test
          npx wrangler deploy --config wrangler.production.toml --dry-run

      - name: Publish the validated update
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git push origin HEAD:master
          echo 'Published the validated application update to master.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production directly from GitHub Actions
        if: steps.production.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '75710b3f985b2a09e812e5c861251ca8'
          SOURCE_COMMIT: ${{ steps.production.outputs.sha }}
        run: |
          npx wrangler deploy --config wrangler.production.toml --keep-vars --var "SOURCE_COMMIT:$SOURCE_COMMIT"
          echo "Deployed production commit $SOURCE_COMMIT." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the deployed site
        if: steps.production.outputs.changed == 'true'
        run: |
          curl --fail --silent --show-error --retry 3 https://subtracker.hx10.com/ -o /tmp/login.html
          curl --fail --silent --show-error --retry 3 https://subtracker.hx10.com/js/lib/api-client.js -o /tmp/api-client.js
          grep -q 'loginForm' /tmp/login.html
          grep -q 'fetch' /tmp/api-client.js
          echo 'Production login page and JavaScript asset checks passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record a fully verified production deployment
        if: steps.production.outputs.changed == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.production.outputs.sha }}
        run: |
          # This tag moves only after Worker, routes, cron, and smoke checks succeed.
          git push --force origin "$SOURCE_COMMIT:refs/tags/production-verified"
          echo "Production verification completed for $SOURCE_COMMIT." >> "$GITHUB_STEP_SUMMARY"
